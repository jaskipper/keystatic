name: Release core tarball

on:
  push:
    tags:
      - 'jsk-*'
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Omit version so action reads it from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install workspace deps (ignore scripts)
        run: pnpm -w install --frozen-lockfile --ignore-scripts

      - name: Install @keystatic/core deps (ignore scripts)
        run: pnpm -C packages/keystatic install --frozen-lockfile --ignore-scripts

      - name: Setup @keystatic/core (generate artifacts)
        run: pnpm -C packages/keystatic run setup

      - name: Build packages (preconstruct)
        run: pnpm -w exec preconstruct build
        env:
          DISABLE_REACT_COMPILER: '1'

      - name: Pack @keystatic/core
        run: pnpm -F @keystatic/core pack --pack-destination ./dist-packs

      - name: Create GitHub Release and upload tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dist-packs/*.tgz
          overwrite: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
