name: Release core tarball

on:
  push:
    tags:
      - 'jsk-*'
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Omit version so action reads it from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install workspace deps (ignore scripts)
        run: pnpm -w install --frozen-lockfile --ignore-scripts

      - name: Install @keystatic/core deps (ignore scripts)
        run: pnpm -C packages/keystatic install --frozen-lockfile --ignore-scripts

      - name: Setup @keystatic/core (generate artifacts)
        run: pnpm -C packages/keystatic run setup

      - name: Build design system l10n
        run: pnpm exec tsx design-system/pkg/build-l10n.mts

      - name: Build packages (preconstruct)
        run: pnpm -w exec preconstruct build
        env:
          DISABLE_REACT_COMPILER: '1'

      - name: Pack @keystatic/core
        run: |
          mkdir -p dist-packs
          pnpm -C packages/keystatic pack --pack-destination ../../dist-packs

      - name: Verify packed package.json integrity
        run: |
          set -euo pipefail
          TARBALL=$(ls dist-packs/*.tgz | head -n1)
          mkdir -p dist-unpack
          tar -xzf "$TARBALL" -C dist-unpack
          node - <<'NODE'
          const fs = require('fs');
          const path = 'dist-unpack/package/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const bad = [];
          for (const k of ['dependencies','devDependencies','peerDependencies','optionalDependencies']) {
            const obj = pkg[k] || {};
            for (const [name, ver] of Object.entries(obj)) {
              if (typeof ver === 'string' && ver.startsWith('workspace:')) {
                bad.push(`${k}:${name}=${ver}`);
              }
            }
          }
          if (bad.length) {
            console.error('\nFound workspace: ranges in packed package.json:');
            console.error(bad.join('\n'));
            process.exit(1);
          }
          console.log('OK: No workspace: ranges in packed package.json');
          NODE

      - name: Create GitHub Release and upload tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dist-packs/*.tgz
          overwrite: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
